<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de propinas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Calculadora de propinas</h1>
  <label for="cuenta">Valor de la cuenta</label>
  <input id="cuenta" type="number" value="50000">
  <label for="propina">Porcentaje de propina</label>
  <select id="propina">
    <option value="10">10 %</option>
    <option value="15">15 %</option>
    <option value="20">20 %</option>
  </select>
  <label for="personas">Entre cuántas personas</label>
  <input id="personas" type="number" value="2">
  <button id="calcular">Calcular</button>
  <p id="resultado">Sin calcular</p>
  <script src="app.js"></script>
</body>
</html>
